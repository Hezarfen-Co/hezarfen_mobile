name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Release artifacts point at production; dev builds fall back to localhost.
  HEZARFEN_BACKEND_ORIGIN: ${{ vars.HEZARFEN_BACKEND_ORIGIN }}

jobs:
  proxy-tests:
    runs-on: ubuntu-latest
    steps:
      # The proxy's unit tests need no frontend bundle, so the private
      # submodule is not checked out here — this job stays runnable on forks.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System deps for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # hezarfen_frontend is private; the default GITHUB_TOKEN cannot read it.
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --cwd frontend --frozen-lockfile
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: hezarfen-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    # iOS builds need Xcode, so they cannot run alongside the Android job.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --cwd frontend --frozen-lockfile
      - run: cargo install tauri-cli --version "^2" --locked
      # Unsigned: signing needs the App Store certificate and a provisioning
      # profile for co.hezarfen.app, which are not available to CI yet.
      - run: cargo tauri ios build --ci --export-method debugging
      - uses: actions/upload-artifact@v4
        with:
          name: hezarfen-ios
          path: src-tauri/gen/apple/build/**/*.ipa
